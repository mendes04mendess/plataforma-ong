<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Instituto Esperança</title>
    <meta name="description" content="Cadastre-se no Instituto Esperança e faça parte das nossas ações sociais.">
    <link rel="stylesheet" href="CSS/style.css">
</head>

<body>
    <header>
        <h1>Instituto Esperança</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="projetos.html">Projetos</a>
            <a href="cadastro.html" aria-current="page">Cadastro</a>
            <a href="doacao.html">Doação</a>
        </nav>
    </header>
    <main>
        <section>
            <h2>Cadastre-se</h2>
            <img src="imagens/ong.jpg" alt="Voluntários do Instituto Esperança realizando uma ação social">
            <p>Cadastre seus dados para fazer parte do Instituto Esperança e conhecer nossas oportunidades de
                voluntariado.</p>
        </section>
        <section>
            <h2>Formulário de Cadastro</h2>
            <form id="formCadastro">
                <fieldset>
                    <legend>Dados pessoais</legend>
                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" required>
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" required>
                    <label for="cpf">Cpf:</label>
                    <input type="text" id="cpf" name="cpf" required maxlength="14">
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone" name="telefone" required maxlength="15">
                    <label for="data-nascimento">Data de nascimento:</label>
                    <input type="date" id="data-nascimento" name="data-nascimento" required>
                </fieldset>
                <fieldset>
                    <legend>Endereço</legend>
                    <label for="endereco">Endereço:</label>
                    <input type="text" id="endereco" name="endereco" required>
                    <label for="cep">CEP:</label>
                    <input type="text" id="cep" name="cep" required maxlength="9">
                    <label for="cidade">Cidade:</label>
                    <input type="text" id="cidade" name="cidade" required>
                    <label for="estado">Estado:</label>
                    <select id="estado" name="estado" required>
                        <option value="">Selecione seu estado</option>
                        <option value="AC">Acre</option>
                        <option value="AL">Alagoas</option>
                        <option value="AP">Amapá</option>
                        <option value="AM">Amazonas</option>
                        <option value="BA">Bahia</option>
                        <option value="CE">Ceará</option>
                        <option value="DF">Distrito Federal</option>
                        <option value="ES">Espírito Santo</option>
                        <option value="GO">Goiás</option>
                        <option value="MA">Maranhão</option>
                        <option value="MT">Mato Grosso</option>
                        <option value="MS">Mato Grosso do Sul</option>
                        <option value="MG">Minas Gerais</option>
                        <option value="PA">Pará</option>
                        <option value="PB">Paraíba</option>
                        <option value="PR">Paraná</option>
                        <option value="PE">Pernambuco</option>
                        <option value="PI">Piauí</option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="RN">Rio Grande do Norte</option>
                        <option value="RS">Rio Grande do Sul</option>
                        <option value="RO">Rondônia</option>
                        <option value="RR">Roraima</option>
                        <option value="SC">Santa Catarina</option>
                        <option value="SP">São Paulo</option>
                        <option value="SE">Sergipe</option>
                        <option value="TO">Tocantins</option>
                    </select>
                </fieldset>
                <button type="submit">Cadastrar</button>
                <p id="mensagem"></p>
            </form>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Instituto Esperança. Todos os direitos reservados.</p>
    </footer>
    <script src="JS/script.js"></script>
</body>

</html>
